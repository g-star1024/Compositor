name: Verify

on:
  push:
  pull_request:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: unit (universal arm64 + x86_64)
    # Push covers same-repo branches. pull_request runs only for forks, so a PR is not tested twice.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Resolve Swift packages
        run: >
          xcodebuild -resolvePackageDependencies
          -project Compositor.xcodeproj
          -scheme Compositor
          -onlyUsePackageVersionsFromResolvedFile

      # Build a UNIVERSAL binary (arm64 + x86_64) so Intel (x86_64) compatibility is
      # verified at compile/link time — not just Apple Silicon. ONLY_ACTIVE_ARCH=NO
      # forces both slices even though the runner is arm64.
      - name: Build for testing (universal)
        id: build
        run: >
          set -o pipefail;
          xcodebuild build-for-testing
          -project Compositor.xcodeproj
          -scheme Compositor
          -destination 'platform=macOS'
          -configuration Debug
          -derivedDataPath DerivedData
          ARCHS="arm64 x86_64"
          ONLY_ACTIVE_ARCH=NO
          CODE_SIGN_IDENTITY=-
          2>&1 | tee build.log

      # Job logs need admin rights on forks; surface compiler errors as annotations instead.
      - name: Surface compiler errors
        if: failure() && steps.build.outcome == 'failure'
        run: |
          if [ -f build.log ]; then
            grep -E "error:" build.log | tr -d '\r' | sed -E 's/^[[:space:]]+//' | sort -u | head -40 |
              while IFS= read -r line; do echo "::error::$line"; done
          fi

      - name: Verify universal binary (arm64 + x86_64)
        run: |
          BIN=DerivedData/Build/Products/Debug/Compositor.app/Contents/MacOS/Compositor
          INFO=$(lipo -info "$BIN")
          echo "$INFO"
          echo "$INFO" | grep -q 'x86_64' || { echo "Missing x86_64 slice"; exit 1; }
          echo "$INFO" | grep -q 'arm64'   || { echo "Missing arm64 slice"; exit 1; }
          echo "Universal binary verified: both arm64 and x86_64 slices present."

      # A green build says nothing about resources: the file-system synchronized
      # groups decide membership on their own, and a missing table only shows up
      # when Camera Raw runs.
      - name: Verify bundled resources
        run: |
          RES=DerivedData/Build/Products/Debug/Compositor.app/Contents/Resources
          MISSING=0
          for f in CameraRawTables.bin CameraRawShadows.bin; do
            if [ -f "$RES/$f" ]; then
              echo "bundled: $f ($(wc -c < "$RES/$f" | tr -d ' ') bytes)"
            else
              echo "MISSING bundled resource: $f"
              MISSING=1
            fi
          done
          [ "$MISSING" -eq 0 ] || exit 1

      # These two suites show real windows and time them, so they run alone after the rest.
      # Tests execute on the native arm64 runner (the universal build already validated x86_64 at link time).
      # Serial: one process makes a crashing test point at itself instead of taking a whole
      # parallel worker's tests down with it. Slightly slower, but failures are deterministic.
      - name: Run unit tests
        id: parallel
        run: >
          set -o pipefail;
          xcodebuild test-without-building
          -project Compositor.xcodeproj
          -scheme Compositor
          -destination 'platform=macOS,arch=arm64'
          -derivedDataPath DerivedData
          -resultBundlePath ParallelResults.xcresult
          -parallel-testing-enabled NO
          -skip-testing:CompositorTests/FloatingPanelTests
          -skip-testing:CompositorTests/SliderSnapTests
          2>&1 | tee parallel-tests.log

      - name: Run window tests serially
        id: serial
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >
          set -o pipefail;
          xcodebuild test-without-building
          -project Compositor.xcodeproj
          -scheme Compositor
          -destination 'platform=macOS,arch=arm64'
          -derivedDataPath DerivedData
          -resultBundlePath SerialResults.xcresult
          -parallel-testing-enabled NO
          -only-testing:CompositorTests/FloatingPanelTests
          -only-testing:CompositorTests/SliderSnapTests
          2>&1 | tee serial-tests.log

      # Job logs need admin rights on forks; surface failing tests as annotations instead.
      # GitHub caps a step at 10 annotations, so pack the failure lines into ONE annotation.
      - name: Surface test failures
        if: failure() && (steps.parallel.outcome == 'failure' || steps.serial.outcome == 'failure')
        run: |
          python3 - <<'PY'
          # xcodebuild emits harmless "error: NSCocoaErrorDomain ... com.apple.linkd" lines;
          # strip them, then print the failing-test block and the log tail in ONE annotation
          # (a step is capped at 10 annotations otherwise).
          noise = ("NSCocoaErrorDomain", "com.apple.linkd", "[Connection]",
                   "Unable to ", "Process Instance Registry", "linkd.autoShortcut")
          def clean(text):
              return [l.strip() for l in text.splitlines()
                      if l.strip() and not any(n in l for n in noise)]
          out = []
          for path in ("parallel-tests.log", "serial-tests.log"):
              try:
                  lines = clean(open(path, errors="replace").read())
              except OSError:
                  continue
              out.append("=== %s ===" % path)
              for i, line in enumerate(lines):
                  if "Failing tests" in line:
                      out.append("--- failing test list ---")
                      out.extend(lines[i:i + 26])
              out.append("--- tail ---")
              out.extend(lines[-45:])
          def esc(s):
              return s.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")[:180]
          print("::error title=Test log::" + "%0A".join(esc(l) for l in out[:120]))
          PY

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: '*.xcresult'
          retention-days: 7
          if-no-files-found: ignore
