name: Build & Release — Universal macOS

# Auto-packages a multi-architecture (arm64 + x86_64) product on every version tag push.
# Complements verify.yml (which only runs unit tests on arm64).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to rebuild & release (leave empty to use the pushed tag)'
        required: false

permissions:
  contents: write   # required to create the GitHub Release

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  universal-pkg:
    name: Build universal DMG
    # Code uses Xcode 26-only APIs (borderShape, ToolbarSpacer, sharedBackgroundVisibility)
    # and relies on Xcode 26's actor-isolation rules. Must match verify.yml's toolchain.
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # CI auth uses the built-in GITHUB_TOKEN — no SSH key or PAT configuration needed.

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Build universal app + DMG (unsigned, multi-arch)
        env:
          SIGN: '0'
          ARCHS: 'arm64 x86_64'
        run: ./scripts/release.sh

      - name: Verify the binary is universal inside the DMG
        run: |
          DMG=$(ls dist/*-universal.dmg | head -n1)
          echo "DMG: $DMG"
          # hdiutil attach output is tab-separated; mount path may contain spaces,
          # so take the last field ($NF), not $3.
          MNT=$(hdiutil attach "$DMG" -nobrowse | awk -F'\t' '/Volumes/{print $NF}' | tr -d '[:space:]' | head -n1)
          # Fallback: find the most recently mounted volume matching the app name.
          if [ -z "$MNT" ] || [ ! -d "$MNT" ]; then
            MNT=$(ls -td /Volumes/Compositor* 2>/dev/null | head -n1)
          fi
          echo "MNT: $MNT"
          BIN="$MNT/Compositor.app/Contents/MacOS/Compositor"
          lipo -info "$BIN"
          hdiutil detach "$MNT" -quiet

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Compositor-universal-dmg
          path: dist/*-universal.dmg
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*-universal.dmg
          name: Compositor ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
