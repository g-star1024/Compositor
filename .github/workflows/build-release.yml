name: Build & Release — Universal macOS

# Auto-packages a multi-architecture (arm64 + x86_64) product on every version tag push.
# Complements verify.yml (which only runs unit tests on arm64).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to rebuild & release (leave empty to use the pushed tag)'
        required: false

permissions:
  contents: write   # required to create the GitHub Release

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  universal-pkg:
    name: Build universal DMG
    # Xcode 16 (macos-15) is the documented minimum to build from source (README).
    # If the project turns out to require Xcode 26-only APIs, switch the runner to
    # `macos-26` and select `sudo xcode-select -s /Applications/Xcode_26.6.app`.
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # CI auth uses the built-in GITHUB_TOKEN — no SSH key or PAT configuration needed.

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build universal app + DMG (unsigned, multi-arch)
        env:
          SIGN: '0'
          ARCHS: 'arm64 x86_64'
        run: ./scripts/release.sh

      - name: Verify the binary is universal inside the DMG
        run: |
          DMG=$(ls dist/*-universal.dmg | head -n1)
          echo "DMG: $DMG"
          MNT=$(hdiutil attach "$DMG" -nobrowse -quiet | awk '/Volumes/{print $3}')
          BIN="$MNT/Compositor.app/Contents/MacOS/Compositor"
          lipo -info "$BIN"
          hdiutil detach "$MNT" -quiet

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Compositor-universal-dmg
          path: dist/*-universal.dmg
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*-universal.dmg
          name: Compositor ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
